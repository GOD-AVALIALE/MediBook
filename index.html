<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediBook - Sunrise Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #0e1736; --page-glow: #1d2f6b; --card: #ffffff;
      --header-a: #2563eb; --header-b: #4338ca;
      --chat-bg: #e9eefb; --user-bubble: #2563eb; --bot-bubble: #ffffff;
      --bot-border: #b9c6e6; --input-bar: #f4f7ff; --input-border: #9fb0d9;
      --send: #c2410c; --send-hover: #9a3412; --ink: #14213d; --muted: #52618a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "DM Sans", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 15%, var(--page-glow) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, #2a1f6b 0%, transparent 40%),
        var(--page);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .app {
      position: relative; width: 100%; max-width: 520px; height: 100%; max-height: 760px;
      display: flex; flex-direction: column; background: var(--card);
      border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    header {
      background: linear-gradient(135deg, var(--header-a), var(--header-b));
      color: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 14px;
    }
    header h1 { margin: 0; font-size: 1.3rem; font-weight: 700; }
    header p { margin: 3px 0 0; font-size: 0.9rem; opacity: 0.92; }
    .menu-btn {
      flex: none; width: 44px; height: 44px; border-radius: 12px; cursor: pointer;
      background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.5);
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
    }
    .menu-btn:hover { background: rgba(255,255,255,0.3); }
    .menu-btn span { width: 20px; height: 2.5px; background: #fff; border-radius: 2px; }
    .menu-btn:focus-visible, .close-btn:focus-visible { outline: 3px solid #fdba74; outline-offset: 2px; }

    #chat {
      flex: 1; overflow-y: auto; padding: 18px 16px; display: flex;
      flex-direction: column; gap: 14px; background: var(--chat-bg);
    }
    .msg {
      max-width: 82%; padding: 10px 14px 12px; border-radius: 16px; line-height: 1.5;
      font-size: 1rem; white-space: pre-wrap; box-shadow: 0 2px 6px rgba(20,33,61,0.12);
    }
    .msg .who { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 3px; opacity: 0.75; }
    .bot { background: var(--bot-bubble); border: 1.5px solid var(--bot-border); align-self: flex-start; border-bottom-left-radius: 4px; }
    .user { background: var(--user-bubble); color: #fff; border: 1.5px solid #1d4ed8; align-self: flex-end; border-bottom-right-radius: 4px; }
    .typing .text { font-style: italic; opacity: 0.65; }
    .input-row { display: flex; gap: 10px; padding: 14px; background: var(--input-bar); border-top: 2px solid var(--bot-border); }
    #box {
      flex: 1; min-width: 0; padding: 13px 15px; font: inherit; font-size: 1rem; color: var(--ink);
      background: #fff; border: 2px solid var(--input-border); border-radius: 12px;
    }
    #box::placeholder { color: #6b7a99; }
    #box:focus { outline: none; border-color: var(--header-a); box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }
    #send {
      padding: 0 22px; font: inherit; font-size: 1rem; font-weight: 700; color: #fff;
      background: var(--send); border: none; border-radius: 12px; cursor: pointer;
    }
    #send:hover { background: var(--send-hover); }
    #send:focus-visible { outline: 3px solid #fdba74; outline-offset: 2px; }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Side panel: previous appointments */
    .scrim { position: absolute; inset: 0; background: rgba(14,23,54,0.5); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 4; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .panel {
      position: absolute; top: 0; bottom: 0; left: 0; width: min(350px, 90%); z-index: 5;
      background: #fff; transform: translateX(-102%); transition: transform .25s;
      display: flex; flex-direction: column; box-shadow: 6px 0 24px rgba(0,0,0,0.25);
    }
    .panel.open { transform: translateX(0); }
    .panel-head {
      background: linear-gradient(135deg, var(--header-a), var(--header-b)); color: #fff;
      padding: 16px 18px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    }
    .panel-head h2 { margin: 0; font-size: 1.1rem; }
    .panel-head p { margin: 3px 0 0; font-size: 0.85rem; opacity: 0.92; }
    .close-btn {
      flex: none; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 1.2rem; line-height: 1;
      color: #fff; background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.5);
    }
    .demo-note { margin: 0; padding: 8px 18px; font-size: 0.8rem; background: #fff7ed; color: #7c2d12; border-bottom: 1px solid #fed7aa; }
    .records { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; background: var(--chat-bg); }
    .rec { background: #fff; border: 1.5px solid var(--bot-border); border-radius: 14px; padding: 12px 14px; }
    .rec-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .rec-date { font-weight: 700; }
    .rec-dept { font-size: 0.8rem; color: var(--muted); }
    .rec-doc { margin: 2px 0 8px; font-size: 0.9rem; color: var(--muted); }
    .row { margin: 6px 0 0; font-size: 0.92rem; line-height: 1.4; }
    .row b { display: block; font-size: 0.75rem; color: var(--muted); }

    @media (max-width: 560px) { body { padding: 0; } .app { border-radius: 0; max-height: none; } }
    @media (prefers-reduced-motion: reduce) { .panel, .scrim { transition: none; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <button class="menu-btn" id="menuBtn" aria-label="Open previous appointments"><span></span><span></span><span></span></button>
      <div>
        <h1>MediBook</h1>
        <p>Book, reschedule, or cancel a doctor appointment</p>
      </div>
    </header>

    <div id="chat">
      <div class="msg bot"><span class="who">MediBook</span><span class="text">Hello! I'm MediBook, the Sunrise Clinic assistant. How can I help you today? Tap the three lines at the top left to see your previous appointments.</span></div>
    </div>

    <div class="input-row">
      <input id="box" type="text" placeholder="Type your message here..." autocomplete="off">
      <button id="send">Send</button>
    </div>

    <div class="scrim" id="scrim"></div>
    <aside class="panel" id="panel" aria-label="Previous appointments">
      <div class="panel-head">
        <div>
          <h2>Previous appointments</h2>
          <p id="summary"></p>
        </div>
        <button class="close-btn" id="closeBtn" aria-label="Close panel">&times;</button>
      </div>
      <p class="demo-note">Demo data for a college project. Not real patient records.</p>
      <div class="records" id="records"></div>
    </aside>
  </div>

  <script>
    // ---- Sample patient records (demo data). Later, the backend will supply these. ----
    const records = [
      { date: "2026-10-18", doctor: "Dr. Meera Kapoor", dept: "General Medicine", reason: "Recurring headaches",
        diagnosis: "Tension headaches linked to screen time and poor sleep", treatment: "Sleep schedule, screen breaks, hydration",
        notes: "The routine helped, and the headaches dropped from daily to about once a week. Continue it and review in 3 months." },
      { date: "2026-08-04", doctor: "Dr. Arjun Rao", dept: "Orthopedics", reason: "Lower back pain",
        diagnosis: "Muscle strain from long sitting hours", treatment: "Stretching plan and a short course of physiotherapy",
        notes: "The stretching and physiotherapy helped but didn't fully solve it, as the pain returns after long sitting. So we added a standing break every hour." },
      { date: "2026-05-20", doctor: "Dr. Sana Iqbal", dept: "Dermatology", reason: "Skin rash on forearms",
        diagnosis: "Contact dermatitis", treatment: "Prescribed cream, avoid the suspected detergent",
        notes: "The cream didn't clear the rash, so we switched to a different treatment and advised an allergy test." },
      { date: "2026-03-12", doctor: "Dr. Meera Kapoor", dept: "General Medicine", reason: "Seasonal fever and cough",
        diagnosis: "Viral infection", treatment: "Rest, fluids, symptom relief",
        notes: "Recovered fully within a week. No follow-up needed." }
    ];

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function fmt(d, opts) { return new Date(d).toLocaleDateString("en-IN", opts); }

    function renderRecords() {
      const box = document.getElementById("records");
      const sorted = [...records].sort((a, b) => b.date.localeCompare(a.date));
      const first = sorted[sorted.length - 1].date;
      document.getElementById("summary").textContent =
        sorted.length + " visits since " + fmt(first, { month: "short", year: "numeric" });

      sorted.forEach(r => {
        const card = el("div", "rec");
        const top = el("div", "rec-top");
        top.appendChild(el("span", "rec-date", fmt(r.date, { day: "numeric", month: "short", year: "numeric" })));
        top.appendChild(el("span", "rec-dept", r.dept));
        card.appendChild(top);
        card.appendChild(el("p", "rec-doc", r.doctor));

        [["Reason", r.reason], ["Diagnosis", r.diagnosis], ["Treatment", r.treatment]].forEach(([label, value]) => {
          const row = el("p", "row");
          row.appendChild(el("b", "", label));
          row.appendChild(document.createTextNode(value));
          card.appendChild(row);
        });

        const notes = el("p", "row");
        notes.appendChild(el("b", "", "Doctor's notes"));
        notes.appendChild(document.createTextNode(r.notes));
        card.appendChild(notes);

        box.appendChild(card);
      });
    }
    renderRecords();

    // ---- Side panel open / close ----
    const panel = document.getElementById("panel");
    const scrim = document.getElementById("scrim");
    function setPanel(open) {
      panel.classList.toggle("open", open);
      scrim.classList.toggle("open", open);
    }
    document.getElementById("menuBtn").addEventListener("click", () => setPanel(true));
    document.getElementById("closeBtn").addEventListener("click", () => setPanel(false));
    scrim.addEventListener("click", () => setPanel(false));
    document.addEventListener("keydown", e => { if (e.key === "Escape") setPanel(false); });

    // ---- Chat ----
    const chat = document.getElementById("chat");
    const box = document.getElementById("box");
    const sendBtn = document.getElementById("send");
    const history = []; // full conversation, sent each time so the AI remembers

    function addMessage(text, who, extraClass) {
      const div = el("div", "msg " + who + (extraClass ? " " + extraClass : ""));
      div.appendChild(el("span", "who", who === "user" ? "You" : "MediBook"));
      div.appendChild(el("span", "text", text));
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = box.value.trim();
      if (!text) return;

      addMessage(text, "user");
      history.push({ role: "user", text: text });
      box.value = "";
      sendBtn.disabled = true;
      const typing = addMessage("Typing...", "bot", "typing");

      try {
        // Sends the chat AND the patient's records to our backend (built in the next step),
        // so the AI can answer questions like "what did the doctor say last time?"
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history, records: records })
        });
        const data = await res.json();
        typing.remove();
        if (data.reply) {
          addMessage(data.reply, "bot");
          history.push({ role: "model", text: data.reply });
        } else {
          addMessage("Something went wrong. Please try again.", "bot");
        }
      } catch (err) {
        typing.remove();
        addMessage("Could not reach the server. Please try again.", "bot");
      }

      sendBtn.disabled = false;
      box.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    box.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
  </script>
</body>
</html>
